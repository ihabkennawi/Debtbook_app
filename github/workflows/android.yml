name: Build DebtBook APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download DebtBook project
        run: |
          curl -L -o /tmp/debt.zip "https://user.uploads.dev/file/772c842f0b7551ce7d941481bde6505b.zip"
          unzip -q -o /tmp/debt.zip -d /tmp/unz
          cp -r /tmp/unz/debtbook-android/. "$GITHUB_WORKSPACE/"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licences
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install platform + build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build AAB
        run: gradle :app:bundleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtBook-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DebtBook-release-aab
          path: app/build/outputs/bundle/release/*.aab
